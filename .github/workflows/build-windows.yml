name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools
        run: pip install setuptools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (skip native builds)
        run: npm ci --ignore-scripts

      - name: Rebuild native modules for Node.js (tests)
        run: npm rebuild better-sqlite3

      - name: Run tests
        run: npm run test:run

      - name: Rebuild native modules for Electron (packaging)
        run: npx --yes electron-rebuild -f -w better-sqlite3 -w @serialport/bindings-cpp

      - name: Build Electron app
        run: npx tsc && npx vite build && npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: n2k-race-logger-windows-x64
          path: dist/*.exe
          retention-days: 90
