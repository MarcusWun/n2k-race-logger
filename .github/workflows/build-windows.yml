name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools
        run: pip install setuptools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Typecheck
        run: npm exec tsc -- --noEmit

      - name: Remove canboatjs native CAN socket binding (UNIX-only, not needed for serial)
        run: |
          Remove-Item -Path node_modules\@canboat\canboatjs\binding.gyp -Force -ErrorAction SilentlyContinue
          Remove-Item -Path node_modules\@canboat\canboatjs\native -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        run: Get-ChildItem -Recurse release/ -ErrorAction SilentlyContinue
        if: always()

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: n2k-race-logger-windows-x64
          path: release/**/*.exe
          retention-days: 90
